<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Watch Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="stage">
      <div id="compassWrap" class="compass-wrap" aria-label="Navigation">
        <div class="ambient ambient-1"></div>
        <div class="ambient ambient-2"></div>

        <div id="compass" class="compass">
          <div class="outer-ring"></div>
          <div class="inner-ring"></div>

          <button class="needle needle-top" data-target="watchlistPanel" aria-label="Watchlist">
            <span class="needle-long"></span>
            <span class="needle-short"></span>
          </button>

          <button class="needle needle-right" data-target="creationPanel" aria-label="Creation">
            <span class="needle-long"></span>
            <span class="needle-short"></span>
          </button>

          <button class="needle needle-bottom" data-target="libraryPanel" aria-label="Library">
            <span class="needle-long"></span>
            <span class="needle-short"></span>
          </button>

          <button class="needle needle-left" data-target="statisticsPanel" aria-label="Statistics">
            <span class="needle-long"></span>
            <span class="needle-short"></span>
          </button>

          <div class="center-core">
            <div class="center-core-inner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <section id="watchlistPanel" class="panel hidden" aria-hidden="true">
    <div class="panel-head">
      <h2>Watchlist</h2>
      <button class="close-panel" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
      <p>This is the Watchlist panel.</p>
    </div>
  </section>

  <section id="creationPanel" class="panel hidden" aria-hidden="true">
    <div class="panel-head">
      <h2>Creation</h2>
      <button class="close-panel" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
      <p>This is the Creation panel.</p>
    </div>
  </section>

  <section id="libraryPanel" class="panel hidden" aria-hidden="true">
    <div class="panel-head">
      <h2>Library</h2>
      <button class="close-panel" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
      <p>This is the Library panel.</p>
    </div>
  </section>

  <section id="statisticsPanel" class="panel hidden" aria-hidden="true">
    <div class="panel-head">
      <h2>Statistics</h2>
      <button class="close-panel" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
      <p>This is the Statistics panel.</p>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
